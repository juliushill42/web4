[package]
name = "web4_ghostchat"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.28", features = ["full"] }
libp2p = { version = "0.51", features = ["tcp", "noise", "yamux", "mdns", "gossipsub", "macros"] }
ed25519-dalek = "2.0"
rand = "0.8"
rusqlite = { version = "0.29", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
sha2 = "0.10"
futures = "0.3"
env_logger = "0.10"
log = "0.4"
crossterm = "0.27"
uuid = { version = "1.4", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
pbkdf2 = "0.12"
btleplug = { version = "0.11", optional = true }

[features]
default = []
ble = ["btleplug"]
